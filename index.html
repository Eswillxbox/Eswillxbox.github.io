以下是一段适配Discord Webhook的极简基础HTML博客代码，直接填入你的Webhook ID和Token就能运行：

html代码：
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EswillxNoah-Anime</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { max-width: 800px; margin: 40px auto; padding: 0 20px; font-family: system-ui, sans-serif; line-height: 1.6; background: #f5f5f5; }
        .post { background: white; padding: 24px; margin-bottom: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .time { color: #888; font-size: 14px; margin-bottom: 12px; }
        h1 { color: #222; margin-bottom: 30px; text-align: center; }
    </style>
</head>
<body>
    <h1>追番列表</h1>
    <div id="posts"></div>

    <script>
        // 这里替换成你自己的Webhook里的ID和Token
        const WEBHOOK_ID = '1568870908695945368';
        const WEBHOOK_TOKEN = 'ps9G2zNCHd_aY8l1oI_S1JZjbDkA00pDbzX1q452DqVJX8g2gHZHL1MUPX8LS4JfB1kJ';

        async function loadPosts() {
            // 拉取你Discord频道里的历史消息
            const res = await fetch(`https://discord.com/api/webhooks/${WEBHOOK_ID}/${WEBHOOK_TOKEN}/messages?limit=50`);
            const messages = await res.json();
            const postsEl = document.getElementById('posts');
            
            // 把消息渲染成博客文章
            messages.forEach(msg => {
                const postEl = document.createElement('div');
                postEl.className = 'post';
                postEl.innerHTML = `
                    <div class="time">${new Date(msg.timestamp).toLocaleString('zh-CN')}</div>
                    <div class="content">${msg.content.replace(/\n/g, '<br>')}</div>
                `;
                postsEl.appendChild(postEl);
            });
        }
        loadPosts();
    </script>
</body>
</html>
