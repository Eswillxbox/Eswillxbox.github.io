fetch("posts.json")
  .then(r => r.json())
  .then(posts => {
    const list = document.getElementById("posts");
    posts.forEach(p => {
      const el = document.createElement("article");
      // 如果页面引入了 marked，就渲染 Markdown
      el.innerHTML = marked.parse(p.content);
      list.appendChild(el);
    });
  });
