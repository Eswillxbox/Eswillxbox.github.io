<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>你的Discord博客</title>
  <!-- 引入Markdown渲染依赖 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* 基础排版样式，适配手机/电脑 */
    body { max-width: 750px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
    article { margin-bottom: 40px; padding-bottom: 30px; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>
  <h1>我的Discord笔记博客</h1>
  <!-- 文章渲染容器 -->
  <div id="posts"></div>

  <script>
    // 加载并渲染Discord同步过来的文章
    fetch("./posts.json")
      .then(res => res.json())
      .then(posts => {
        const postContainer = document.getElementById("posts");
        // 按消息ID倒序：最新发的内容排在最前面
        posts.sort((a, b) => b.id - a.id);
        
        posts.forEach(post => {
          const article = document.createElement("article");
          // 把Discord的Markdown内容转成网页格式
          article.innerHTML = marked.parse(post.content);
          postContainer.appendChild(article);
        });
      })
      .catch(err => {
        // 路径错误时显示提示，方便排查
        document.getElementById("posts").innerText = "读取文章失败，请确认posts.json和本文件在同一目录";
        console.error(err);
      })
  </script>
</body>
</html>
